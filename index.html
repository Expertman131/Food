<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>васаби.</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-device="phone" data-mode="client">

<header class="topbar">
  <div class="tb-brand">
    <span class="tb-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 1 9-4 14-11 14H5z"/><path d="M4 20c2-4 5-7 9-9"/></svg>
    </span>
    <span class="tb-title">
      <strong>васаби.</strong>
    </span>
  </div>
  <div class="tb-right">
    <div class="tb-size">
      <svg class="tb-size-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.6h3"/></svg>
      <select id="deviceSize" aria-label="Размер экрана">
        <option value="phone">iPhone 15/16 · 393×852</option>
        <option value="max">iPhone Pro Max · 430×932</option>
        <option value="pixel">Pixel 8/9 · 412×892</option>
        <option value="compact">Galaxy S24 · 360×780</option>
        <option value="small">iPhone SE · 375×667</option>
        <option value="tablet">Планшет · 768×1024</option>
        <option value="wide">Терминал в зале · 1024×768</option>
        <option value="full">Во весь экран</option>
        <option value="custom">Свой размер…</option>
      </select>
      <span class="tb-size-custom" id="sizeCustom" hidden>
        <input type="number" id="sizeW" min="320" max="1600" step="1" value="393" aria-label="Ширина экрана в пикселях">
        <span class="tb-size-x">×</span>
        <input type="number" id="sizeH" min="480" max="1400" step="1" value="852" aria-label="Высота экрана в пикселях">
      </span>
    </div>
    <nav class="mode-switch" aria-label="Режим прототипа">
      <button type="button" class="mode-btn is-active" data-mode="client">Клиент</button>
      <button type="button" class="mode-btn" data-mode="admin">Админ-панель</button>
    </nav>
  </div>
</header>

<main class="stage">

  <!-- ======================= КЛИЕНТСКОЕ ПРИЛОЖЕНИЕ ======================= -->
  <section class="client-stage" id="clientStage">

    <div class="device-wrap">
      <div class="device" role="region" aria-label="Прототип мобильного приложения васаби">
        <div class="device-screen">

          <div class="statusbar" aria-hidden="true">
            <span class="sb-time">9:41</span>
            <span class="sb-notch"></span>
            <span class="sb-icons">
              <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
              <svg viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a10 10 0 0114 0"/><path d="M3.6 7a6.4 6.4 0 018.8 0"/><circle cx="8" cy="10" r="1.1" fill="currentColor" stroke="none"/></svg>
              <svg viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-width="1.2" opacity=".5"/><rect x="2.6" y="2.6" width="15" height="6.8" rx="1.8" fill="currentColor"/><path d="M23.6 4.4v3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".5"/></svg>
            </span>
          </div>

          <div class="viewport" id="viewport" tabindex="-1"></div>

          <div class="dock">
            <div id="cartbarSlot"></div>
            <nav class="tabbar" id="tabbar" aria-label="Основная навигация"></nav>
          </div>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>

    <aside class="inspector" id="inspector">
      <div class="insp-block">
        <h2 class="insp-title">Инструкция</h2>
        <p class="insp-doc">Как пользоваться прототипом: разделы админки, типовые задачи по шагам и честные ограничения.</p>
        <a class="btn-outline btn-sm" href="guide.html">Открыть инструкцию</a>
      </div>
      <div class="insp-block">
        <h2 class="insp-title">Экраны</h2>
        <div class="insp-list" id="screenList"></div>
      </div>
      <div class="insp-block">
        <h2 class="insp-title">Состояние</h2>
        <dl class="insp-state" id="inspState"></dl>
        <button type="button" class="btn-outline btn-sm" data-act="reset">Сбросить демо-данные</button>
      </div>
      <div class="insp-block">
        <h2 class="insp-title">Что работает</h2>
        <ul class="insp-list-plain" id="inspFeatures"></ul>
      </div>
    </aside>

  </section>

  <!-- ======================= АДМИН-ПАНЕЛЬ ======================= -->
  <section class="admin-stage" id="adminStage" hidden>
    <div class="toast admin-toast" id="adminToast" role="status" aria-live="polite"></div>
    <div class="admin-frame">
      <div class="admin-browser">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="admin-url">admin.vasabi.ru</span>
      </div>
      <div class="admin-app">
        <aside class="admin-side" id="adminSide"></aside>
        <div class="admin-main">
          <header class="admin-top" id="adminTop"></header>
          <div class="admin-body" id="adminBody"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<script src="data.js"></script>
<script src="qr.js"></script>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
